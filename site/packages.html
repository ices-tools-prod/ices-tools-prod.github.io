<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICES R packages</title>
  <meta name="description" content="All R packages maintained by ICES, with CRAN, r-universe and GitHub status.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="./">ICES R packages</a>
      <nav>
        <a href="./">Overview</a>
        <a href="packages.html" aria-current="page">Packages</a>
      </nav>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <main class="wrap">
    <h1>Packages</h1>
    <p class="lede">Select a package to see its details.</p>

    <div class="controls">
      <input id="search" type="search" placeholder="Search packages, titles, maintainers" aria-label="Search">
      <select id="health" aria-label="Status">
        <option value="">Any status</option>
        <option value="error">Action needed</option>
        <option value="warning">Needs attention</option>
        <option value="ok">OK</option>
      </select>
      <select id="cran" aria-label="CRAN">
        <option value="">CRAN: any</option>
        <option value="cran">On CRAN</option>
        <option value="archived">Archived on CRAN</option>
        <option value="none">Not on CRAN</option>
        <option value="unreleased">Unreleased changes</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="package">Package</th>
            <th data-key="health">Status</th>
            <th data-key="github">GitHub</th>
            <th data-key="cran">CRAN</th>
            <th data-key="cranchecks">CRAN checks</th>
            <th data-key="universe">r-universe</th>
            <th data-key="issues" class="num">Issues</th>
            <th data-key="prs" class="num">PRs</th>
            <th data-key="commit" class="hide-sm">Last commit</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="9" class="sub">Loading&hellip;</td></tr></tbody>
      </table>
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      The list of packages is set in
      <a href="https://github.com/ices-tools-prod/ices-tools-prod.github.io/blob/main/packages.json">packages.json</a>.
      Source: <a href="https://github.com/ices-tools-prod/ices-tools-prod.github.io">ices-tools-prod/ices-tools-prod.github.io</a>.
    </div>
  </footer>

  <script src="assets/common.js"></script>
  <script>
    const HEALTH_ORDER = { error: 0, warning: 1, ok: 2 };
    const CRAN_ORDER = { cran: 0, archived: 1, none: 2 };
    const CHECK_ORDER = { ERROR: 0, FAILURE: 0, WARNING: 1, NOTE: 2, OK: 3 };

    const sortKeys = {
      package: p => p.package.toLowerCase(),
      health: p => HEALTH_ORDER[p.health],
      github: p => p.github.version || "",
      cran: p => CRAN_ORDER[p.cran.status],
      cranchecks: p => p.cran.checks ? CHECK_ORDER[p.cran.checks.worst] ?? 9 : 9,
      universe: p => p.runiverse ? (p.runiverse.build_status !== "success" ? 0 : CHECK_ORDER[p.runiverse.checks.worst] ?? 9) : 9,
      issues: p => p.github.open_issues ?? -1,
      prs: p => p.github.open_prs ?? -1,
      commit: p => p.github.last_commit || ""
    };

    let packages = [];
    let sort = { key: "package", dir: 1 };
    const open = new Set();

    function list(items, empty) {
      return items && items.length ? h("div", { class: "chips" }, items) : h("span", { class: "sub" }, empty || "None");
    }

    function details(p) {
      const g = p.github, c = p.cran, u = p.runiverse;
      const links = [
        h("li", {}, h("a", { href: g.url }, "GitHub repository")),
        c.url && h("li", {}, h("a", { href: c.url }, "CRAN page")),
        c.checks && h("li", {}, h("a", { href: c.checks.url }, "CRAN check results")),
        u && h("li", {}, h("a", { href: u.url }, "r-universe page")),
        u && u.build_url && h("li", {}, h("a", { href: u.build_url }, "r-universe build log")),
        g.homepage && h("li", {}, h("a", { href: g.homepage }, "Website"))
      ];

      const cranText = c.status === "cran"
        ? "Version " + c.version + ", published " + c.published + (c.deadline ? ". Deadline: " + c.deadline : "")
        : c.status === "archived" ? (c.comment || "Archived") : "Not on CRAN";

      return h("div", { class: "details-grid" },
        h("div", {},
          h("h3", {}, "About"),
          h("p", {}, p.title || g.description || ""),
          p.maintainer && h("p", { class: "sub" }, "Maintainer: " + p.maintainer),
          p.notes && h("p", {}, p.notes)),
        h("div", {},
          h("h3", {}, "Status"),
          p.issues.length
            ? h("ul", {}, p.issues.map(i => h("li", {}, i.text)))
            : h("p", { class: "sub" }, "No problems found")),
        h("div", {},
          h("h3", {}, "CRAN"),
          h("p", {}, cranText),
          c.first_release && h("p", { class: "sub" }, "First released " + c.first_release)),
        h("div", {},
          h("h3", {}, "Last commit"),
          h("p", {}, g.last_commit ? formatDate(g.last_commit) + " (" + g.default_branch + ")" : "Unknown"),
          g.last_commit_message && h("p", { class: "sub" }, g.last_commit_message)),
        h("div", {},
          h("h3", {}, "Uses ICES packages"),
          list(p.ices_dependencies.map(d => badge(d, "info", "#" + encodeURIComponent(d))))),
        h("div", {},
          h("h3", {}, "Used by ICES packages"),
          list(p.ices_reverse_dependencies.map(d => badge(d, "info", "#" + encodeURIComponent(d))))),
        h("div", {},
          h("h3", {}, "Links"),
          h("ul", {}, links))
      );
    }

    function row(p) {
      const isOpen = open.has(p.package);
      const toggle = () => {
        isOpen ? open.delete(p.package) : open.add(p.package);
        history.replaceState(null, "", isOpen ? location.pathname : "#" + encodeURIComponent(p.package));
        draw();
      };
      const tr = h("tr", { class: "row", id: "pkg-" + p.package, tabindex: "0", "aria-expanded": String(isOpen),
          onclick: e => { if (!e.target.closest("a")) toggle(); },
          onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } } },
        h("td", {}, h("div", { class: "pkgname" }, p.package), h("div", { class: "sub" }, p.title || "")),
        h("td", {}, badge(healthLabel(p.health), p.health === "ok" ? "ok" : p.health)),
        h("td", {}, h("span", { class: "version" }, g(p.github.version))),
        h("td", {}, cranBadge(p)),
        h("td", {}, cranCheckBadge(p)),
        h("td", {}, universeBadge(p)),
        h("td", { class: "num" }, p.github.open_issues ? h("a", { href: p.github.url + "/issues" }, p.github.open_issues) : g(p.github.open_issues)),
        h("td", { class: "num" }, p.github.open_prs ? h("a", { href: p.github.url + "/pulls" }, p.github.open_prs) : g(p.github.open_prs)),
        h("td", { class: "hide-sm", title: formatDate(p.github.last_commit) }, relativeTime(p.github.last_commit))
      );
      return isOpen ? [tr, h("tr", { class: "details" }, h("td", { colspan: "9" }, details(p)))] : [tr];
    }

    function g(x) { return x === null || x === undefined ? "–" : x; }

    function filtered() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const health = document.getElementById("health").value;
      const cran = document.getElementById("cran").value;
      return packages.filter(p =>
        (!q || [p.package, p.title, p.maintainer, p.github.repo].some(x => x && x.toLowerCase().includes(q))) &&
        (!health || p.health === health) &&
        (!cran || (cran === "unreleased" ? p.unreleased : p.cran.status === cran)));
    }

    function draw() {
      const key = sortKeys[sort.key];
      const rows = filtered().sort((a, b) => {
        const x = key(a), y = key(b);
        return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || a.package.localeCompare(b.package);
      });
      document.getElementById("rows").replaceChildren(...(rows.length
        ? rows.flatMap(row)
        : [h("tr", {}, h("td", { colspan: "9", class: "sub" }, "No packages match."))]));
      document.getElementById("count").textContent = rows.length + " of " + packages.length + " packages";
      document.querySelectorAll("thead th").forEach(th =>
        th.setAttribute("aria-sort", th.dataset.key === sort.key ? (sort.dir > 0 ? "ascending" : "descending") : "none"));
    }

    function openFromHash() {
      const name = decodeURIComponent(location.hash.slice(1));
      if (!name || !packages.some(p => p.package === name)) return;
      open.add(name);
      draw();
      document.getElementById("pkg-" + name).scrollIntoView({ block: "center" });
    }

    document.querySelectorAll("thead th").forEach(th => th.addEventListener("click", () => {
      sort = { key: th.dataset.key, dir: sort.key === th.dataset.key ? -sort.dir : 1 };
      draw();
    }));
    ["search", "health", "cran"].forEach(id => document.getElementById(id).addEventListener("input", draw));
    window.addEventListener("hashchange", openFromHash);

    loadStatus()
      .then(data => { packages = data.packages; draw(); openFromHash(); })
      .catch(err => showError(document.querySelector(".table-wrap"), err));
  </script>
</body>
</html>
