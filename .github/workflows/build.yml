# Render the Quarto site and publish it to GitHub Pages. Rendering runs
# scripts/build_status.R first (pre-render in _quarto.yml) to collect the
# package status. Runs every day, on every push to main, and by hand from
# the Actions tab.

name: Build status page

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "curl", "xml2", "knitr", "rmarkdown", "htmltools", "reactable"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
