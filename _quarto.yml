project:
  type: website
  output-dir: _site
  # before rendering: collect the package status (data/status.json), check
  # the web services (data/apis.json), and create the package and API pages
  pre-render:
    - scripts/build_status.R
    - scripts/check_apis.R
    - scripts/make_pages.R
  render:
    - index.qmd
    - packages.qmd
    - apis.qmd
    - package/*.qmd
    - api/*.qmd
  # run R code from the project folder, so pages in sub-folders find R/ and data/
  execute-dir: project

website:
  title: "ICES R packages"
  site-url: https://ices-tools-prod.github.io
  repo-url: https://github.com/ices-tools-prod/ices-tools-prod.github.io
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: packages.qmd
        text: Packages
      - href: apis.qmd
        text: Web services
    right:
      - icon: github
        href: https://github.com/ices-tools-prod/ices-tools-prod.github.io
        aria-label: GitHub repository
  page-footer:
    left: >
      Packages are listed in
      [packages.json](https://github.com/ices-tools-prod/ices-tools-prod.github.io/blob/main/packages.json).
    right: >
      Status from CRAN, the ICES [r-universe](https://ices-tools-prod.r-universe.dev)
      and GitHub, updated daily.

format:
  html:
    theme:
      light: cosmo
      dark: darkly

execute:
  echo: false
  warning: false
  message: false
